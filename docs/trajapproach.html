<style>
  :root {
    /* Core palette */
    --bg: #1d7a73;              /* Oxford blue */
    --bg-2: #ffffff;           /* Deep navy */
    --panel: #f4f6f9;          /* Light grey */
    --panel-strong: #ffffff;   /* White */
    --primary: #1d7a73;        /* Green accent */
    --primary-hover: #165f5a;  /* Green hover */
    --text: #183153;           /* Dark blue text */
    --text-dark: #081a33;      /* Extra-deep blue */
    --text-inverse: #f8fbff;   /* Near-white text */
    --muted: #617287;          /* Muted slate */
    --border: #d8e2eb;        /* Soft border */
    --radius: 18px;

    /* UI surfaces */
    --title-bg: linear-gradient(135deg, #ffffff, #f4f6f9);
    --nav-bg: rgba(48, 52, 99, 0.51);
    --soft: #eef4f8;
    --soft-2: #e6f3f1;

    /* Shadows */
    --shadow: 0 15px 40px rgba(2, 14, 30, 0.18);
    --shadow-soft: 0 8px 20px rgba(2, 14, 30, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--text);
    line-height: 1.6;
    padding-bottom: 60px;
  }

  .site-header {
    width: 100%;
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--nav-bg);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 2px 15px rgba(0, 0, 0, 0.18);
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 18px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .site-brand {
    font-size: 34px;
    font-weight: 700;
    color: var(--text-inverse);
    letter-spacing: -0.02em;
  }

  .site-tagline {
    margin-top: 6px;
    font-size: 16px;
    color: rgba(248, 251, 255, 0.78);
  }

  .site-nav {
    display: flex;
    justify-content: center;
    gap: 18px;
    padding: 0 20px 18px;
    flex-wrap: wrap;
  }

  .navblock {
    display: inline-block;
    background: rgba(255, 255, 255, 0.96);
    padding: 12px 24px;
    border-radius: 999px;
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(2, 14, 30, 0.10);
    transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .navblock:hover,
  .navblock:focus-visible {
    background: var(--soft);
    border-color: #c6d3df;
    transform: translateY(-2px);
    outline: none;
  }

  .navblock.active {
    background: var(--soft-2);
    color: var(--primary);
    border-color: rgba(29, 122, 115, 0.25);
  }

  main {
    max-width: 1100px;
    margin: 28px auto 0;
    padding: 0 20px;
  }

  .app-card {
    background: var(--panel-strong);
    padding: 40px;
    border-radius: 22px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }

  .title-banner {
    background: var(--title-bg);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 26px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
  }

  .title-banner h1 {
    margin: 0;
    font-size: 2.4rem;
    color: var(--text);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .title-banner p {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 900px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 20px;
    margin-top: 22px;
  }

  .section-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 8px 20px rgba(2, 14, 30, 0.05);
  }

  .section-card h2 {
    margin: 0 0 12px;
    font-size: 1.35rem;
    color: var(--text);
    border-bottom: 2px solid #dee6ee;
    padding-bottom: 8px;
  }

  .section-card h3 {
    margin: 18px 0 10px;
    font-size: 1.05rem;
    color: var(--text);
  }

  p {
    margin: 0 0 12px;
  }

  .muted {
    color: var(--muted);
  }

  .formula {
    background: #f8fbff;
    border: 1px solid #dde6ef;
    border-radius: 14px;
    padding: 14px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    overflow-x: auto;
    white-space: pre-wrap;
    color: #ffffff;
    margin: 12px 0;
  }

  .highlight {
    background: #edf7f6;
    border-left: 4px solid var(--primary);
    padding: 14px 16px;
    border-radius: 12px;
    margin: 14px 0;
  }

  .content-list {
    margin: 0;
    padding-left: 20px;
  }

  .content-list li {
    margin: 8px 0;
  }

  .link-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 18px;
  }

    button {
      background: var(--primary);
      border: none;
      padding: 14px 28px;
      border-radius: 14px;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover,
    button:focus-visible {
      background: var(--primary-hover);
      transform: translateY(-2px);
      outline: none;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;

      border: none;
      border-radius: var(--radius);
      background: var(--primary);
      color: white;
      padding: 12px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover { background: var(--primary-hover); }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;

    }

  .small-box {
    background: #fafcff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .small-box strong {
    color: var(--text);
  }

  footer {
    margin-top: 24px;
    text-align: center;
    color: rgba(248, 251, 255, 0.72);
    font-size: 0.95rem;
  }

  code {
    background: #eef2ff;
    color: #3730a3;
    padding: 2px 5px;
    border-radius: 4px;
  }

  @media (max-width: 860px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 720px) {
    .header-inner {
      padding-top: 14px;
      padding-bottom: 10px;
    }

    .site-brand {
      font-size: 24px;
    }

    .app-card {
      padding: 22px;
    }

    .title-banner h1 {
      font-size: 1.7rem;
    }

    .title-banner p {
      font-size: 0.98rem;
    }
  }
</style>
